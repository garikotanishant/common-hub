name: Verify community assistant
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Check live Gemini connection
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const endpoint = 'https://common-hub-gemini-garikotanishant.netlify.app/api/chat';
          const headers = { Origin: 'https://garikotanishant.github.io', 'Content-Type': 'application/json' };
          let health, config;
          for (let attempt = 0; attempt < 18; attempt++) {
            health = await fetch(endpoint, { headers, signal: AbortSignal.timeout(15000) });
            config = await health.json();
            if (config.revision === process.env.GITHUB_SHA) break;
            console.log('Waiting for Netlify to publish this commit...');
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (config.revision !== process.env.GITHUB_SHA) throw new Error('Netlify has not published this commit.');
          console.log('Backend health:', health.status, 'configured:', config.configured === true);
          if (!health.ok || config.configured !== true) process.exit(1);
          const chat = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify({ message: 'Where can I find books in Suwanee?', history: [] }), signal: AbortSignal.timeout(50000) });
          const result = await chat.json();
          console.log('Gemini reply:', chat.status, 'answer received:', typeof result.answer === 'string' && Boolean(result.answer.trim()), 'error:', result.error || 'none', 'provider status:', result.providerStatus || 'none', 'reason:', result.reason || 'none');
          if (!chat.ok || typeof result.answer !== 'string' || !result.answer.trim()) process.exit(1);
          JS
